# Recurring tasks executed by the Solid Queue scheduler (runs inside Puma,
# see SOLID_QUEUE_IN_PUMA in docker-compose.yml).
default: &default
  return_reminders:
    class: ReturnRemindersJob
    queue: default
    schedule: every day at 8am Europe/Warsaw

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
